<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fruver Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --ink:#2b3440;
  --ink-soft:#66717e;
  --green:#1FA84D; --green-dark:#14803A; --green-soft:#E8F8EE;
  --yellow:#FFC61A; --yellow-dark:#DDA400; --yellow-soft:#FFF6D9;
  --orange:#FF7A1F; --orange-dark:#E05F00; --orange-soft:#FFEEDF;
  --red:#E5484D; --red-soft:#FDECEC;
  --line:#EDF0F3;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --shadow:0 10px 30px rgba(43,52,64,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  overflow:hidden;height:100dvh;max-width:100vw;
}
h1,h2,h3,.display{font-family:'Fredoka',sans-serif}
button{font-family:'Fredoka',sans-serif;border:none;cursor:pointer;background:none;color:inherit}
input,select,textarea{font-family:'Nunito',sans-serif;font-size:16px}

/* ---------- fondo animado ---------- */
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:float 16s ease-in-out infinite}
.blob.g{width:44vmax;height:44vmax;background:#b7f0c8;top:-18vmax;left:-14vmax}
.blob.y{width:38vmax;height:38vmax;background:#ffe9a3;bottom:-14vmax;right:-10vmax;animation-delay:-5s}
.blob.o{width:30vmax;height:30vmax;background:#ffd3ae;top:40%;left:60%;animation-delay:-10s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vmax,-3vmax) scale(1.08)}66%{transform:translate(-3vmax,3vmax) scale(.94)}}
.floaties{position:fixed;inset:0;z-index:0;pointer-events:none}
.floaty{position:absolute;font-size:34px;opacity:.14;animation:drift linear infinite}
@keyframes drift{from{transform:translateY(110dvh) rotate(0deg)}to{transform:translateY(-15dvh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.blob,.floaty{animation:none}.floaty{display:none}}

/* ---------- app shell ---------- */
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;max-width:1080px;margin:0 auto;width:100%;overflow-x:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px 0}
.view.active{display:flex;animation:viewIn .38s cubic-bezier(.34,1.4,.5,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:10px;padding:2px 2px 12px;flex:0 0 auto}
.topbar h1{font-size:22px;font-weight:600;letter-spacing:.2px}
.topbar .sub{font-size:13px;color:var(--ink-soft);font-family:'Nunito';font-weight:700}
.spacer{flex:1}
.content{flex:1;min-height:0;display:flex;flex-direction:column}
.scrolly{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}

/* ---------- botones squish (firma) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;
  border-radius:16px;padding:13px 20px;color:#fff;position:relative;transition:transform .09s ease, box-shadow .09s ease, filter .2s}
.btn:active{transform:translateY(4px)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-dark)}
.btn.green:active{box-shadow:0 0 0 var(--green-dark)}
.btn.yellow{background:var(--yellow);color:#5c4a00;box-shadow:0 4px 0 var(--yellow-dark)}
.btn.yellow:active{box-shadow:0 0 0 var(--yellow-dark)}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-dark)}
.btn.orange:active{box-shadow:0 0 0 var(--orange-dark)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d9dee4;border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 0 0 #d9dee4}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:13px}
.btn.block{width:100%}
.btn[disabled],.btn:disabled{opacity:.45;pointer-events:none;filter:grayscale(.2)}
.btn[disabled]{filter:grayscale(.5) opacity(.55);pointer-events:none}
@media(hover:hover){
  .btn:hover{filter:brightness(1.05)}
  .btn.green:hover{box-shadow:0 6px 0 var(--green-dark);transform:translateY(-2px)}
  .btn.yellow:hover{box-shadow:0 6px 0 var(--yellow-dark);transform:translateY(-2px)}
  .btn.orange:hover{box-shadow:0 6px 0 var(--orange-dark);transform:translateY(-2px)}
  .btn.ghost:hover{box-shadow:0 6px 0 #d9dee4;transform:translateY(-2px)}
}

/* ---------- tarjetas ---------- */
.card{background:#fff;border:2px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow)}
.pop{animation:pop .45s cubic-bezier(.34,1.56,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(14px)}to{opacity:1;transform:none}}
.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}

/* ---------- login ---------- */
.login-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-bottom:30px}
.logo{font-family:'Fredoka';font-size:40px;font-weight:700;letter-spacing:.5px;line-height:1;text-align:center}
.logo .fr{color:var(--green)} .logo .pe{color:var(--orange)}
.logo-emoji{font-size:64px;animation:bounceIn 1s cubic-bezier(.34,1.56,.5,1)}
@keyframes bounceIn{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.tagline{color:var(--ink-soft);font-weight:700;text-align:center}
.login-card{width:100%;max-width:380px;padding:22px 20px;border-radius:var(--r-lg)}
.login-card .field{margin-bottom:14px}
.login-card .field:last-of-type{margin-bottom:18px}
.login-hint{font-size:12px;color:var(--ink-soft);font-weight:700;text-align:center;line-height:1.5;max-width:380px}
.login-hint code{font-family:'Nunito',monospace;font-size:11px;background:var(--green-soft);padding:1px 6px;border-radius:6px}

/* ---------- vista cliente: lista de productos (móvil-first) ---------- */
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.mode-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-md);background:#fff;
  border:2px solid var(--line);box-shadow:0 3px 0 #e6eaee;font-family:'Fredoka';font-weight:600;font-size:14px;transition:.15s;text-align:left}
.mode-btn .ic{font-size:22px;flex:none}
.mode-btn:active{transform:translateY(3px);box-shadow:0 0 0 #e6eaee}

.prod-list{flex:1;min-height:0;display:flex;flex-direction:column;border:2px solid var(--line);
  border-radius:var(--r-md);background:#fff;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;box-shadow:var(--shadow);scrollbar-width:thin}
.prod-row{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;min-height:64px;
  border-bottom:1px solid var(--line);background:#fff;transition:background .12s;position:relative}
.prod-row:last-child{border-bottom:none}
.prod-row.selected{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green)}
.prod-thumb{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;font-size:20px;
  border-radius:9px;background:var(--row-tint,#E8F8EE);overflow:hidden;line-height:1}
.prod-thumb img{width:28px;height:28px;object-fit:contain;display:block}
.prod-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.prod-name-row{display:flex;align-items:center;gap:4px;min-width:0}
.pname{font-family:'Fredoka';font-weight:600;font-size:13px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.badge-freq{flex:none;font-size:10px;line-height:1;opacity:.85}
.unit-sel{border:1.5px solid var(--line);border-radius:8px;padding:2px 4px;font-weight:800;font-size:11px;
  background:#fff;height:26px;max-width:76px;color:var(--ink-soft)}
.prod-extra-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.prod-extra-row .unit-sel,.prod-extra-row .var-sel{flex:1;min-width:72px;max-width:110px;height:28px;font-size:11px;padding:2px 6px}
.prod-extra-row .var-in{flex:1;min-width:80px;height:28px;border:1.5px solid var(--line);border-radius:8px;padding:2px 8px;font-weight:700;font-size:11px}
.valor-hint{font-size:12px;font-weight:800;color:var(--orange-dark);margin-top:4px;padding:6px 8px;background:var(--orange-soft);border-radius:8px}
.consol-list{display:flex;flex-direction:column;gap:4px}
.consol-list-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:#fff}
.consol-list-row.on{border-color:var(--green);background:var(--green-soft)}
.consol-chk-wrap{flex-shrink:0}
.consol-chk-wrap input{width:20px;height:20px;accent-color:var(--green)}
.consol-list-main{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer}
.consol-list-row .cn{flex:1;min-width:0}
.consol-list-row .cn b{font-size:14px;display:block;font-family:'Fredoka'}
.consol-list-row .cn span{font-size:11px;color:var(--ink-soft);font-weight:700}
.consol-list-row .cq{font-family:'Fredoka';font-weight:700;font-size:15px;color:var(--green);flex-shrink:0}
.consol-nota-in.slim{flex:1 1 100%;font-size:11px;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px}
.consol-action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.prod-stepper{flex:0 0 auto;display:flex;align-items:center;gap:3px}
.step-btn{width:44px;height:44px;border-radius:11px;font-size:20px;font-weight:700;color:#fff;
  display:grid;place-items:center;transition:transform .08s;flex:none;touch-action:manipulation}
.step-btn.minus{background:var(--orange);box-shadow:0 3px 0 var(--orange-dark)}
.step-btn.plus{background:var(--green);box-shadow:0 3px 0 var(--green-dark)}
.step-btn:active{transform:translateY(3px);box-shadow:none!important}
.qty-in{width:44px;height:44px;text-align:center;font-weight:800;font-size:16px;border:2px solid var(--line);
  border-radius:11px;color:var(--ink);flex:none;-moz-appearance:textfield}
.qty-in::-webkit-outer-spin-button,.qty-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.price-in{width:calc(44px * 1.05 + 2px)!important;min-width:48px}
.order-price-row{display:flex;gap:8px;align-items:stretch;margin-top:8px;width:100%}
.order-price-in{flex:1;min-width:0;height:48px;text-align:left;padding:0 14px;font-weight:800;font-size:18px;border:2px solid var(--line);border-radius:12px;color:var(--ink);-moz-appearance:textfield}
.order-price-in:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(31,168,77,.15)}
.order-price-unit{flex:0 0 auto;min-width:78px;height:48px;border:2px solid var(--line);border-radius:12px;padding:0 10px;font-weight:800;font-size:15px;background:#fff}
.order-item-row{align-items:flex-start;padding:12px}
.order-item-row .re{font-size:32px;flex-shrink:0}
.order-item-row .rn{min-width:0;flex:1}
.qty-in:focus{outline:none;border-color:var(--green)}
.qty-in.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.12);border-color:var(--green)}}

@media(min-width:760px){
  .mode-btn{padding:12px 14px;font-size:15px}
  .mode-btn .ic{font-size:26px}
  .prod-row{min-height:56px;padding:6px 10px 6px 8px;gap:10px}
  .prod-thumb{width:38px;height:38px;flex-basis:38px;font-size:22px}
  .prod-thumb img{width:32px;height:32px}
  .pname{font-size:14px}
}
#v-order .topbar{padding-bottom:8px}
#v-order .topbar h1{font-size:20px}
#v-order .topbar .sub{font-size:12px}
.prod-search{flex:0 0 auto;margin-bottom:8px}
.prod-search input{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:var(--r-md);
  font-weight:700;font-size:14px;background:#fff;box-shadow:var(--shadow)}
.prod-search input:focus{outline:none;border-color:var(--green)}
.prod-syn-hint{font-size:10px;color:var(--green-dark);font-weight:800;line-height:1.2;margin-top:1px}
.prod-search-empty{padding:20px 12px;text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft)}

/* ---------- interpretación / vocabulario / foto ---------- */
.photo-sheet{display:flex;flex-direction:column;gap:12px}
.photo-tutorial{background:var(--yellow-soft);border:2px solid var(--yellow);border-radius:var(--r-md);padding:10px;text-align:center}
.photo-tutorial.highlight{animation:pop .4s both}
.photo-tutorial-title{font-family:'Fredoka';font-weight:600;font-size:15px;margin-bottom:8px;color:#5c4a00}
.photo-tutorial-img{width:100%;max-height:min(50dvh,340px);object-fit:contain;border-radius:12px;background:#fff;border:2px solid var(--line);cursor:pointer}
.photo-tutorial-hint{font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:8px;line-height:1.4}
.photo-tutorial-link{font-size:12px;font-weight:800;color:var(--green-dark);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'Nunito';padding:4px 0}
.photo-user-preview{text-align:center;padding:0;background:transparent;border:none;border-radius:0}
.photo-user-lbl{font-size:12px;font-weight:800;color:var(--green-dark);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.photo-user-thumb{width:100%;max-width:100%;max-height:min(55dvh,420px);object-fit:contain;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;display:block}
.photo-client-wide{width:100%;max-width:100%;object-fit:contain;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;display:block;touch-action:manipulation}
.photo-lightbox{position:fixed;inset:0;background:rgba(10,14,20,.94);z-index:300;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.photo-lightbox.open{display:flex}
.photo-lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.photo-actions{display:flex;flex-direction:column;gap:8px}
.photo-actions-hint{font-size:12px;font-weight:700;color:var(--ink-soft);text-align:center;line-height:1.35}
.photo-review-block{margin-bottom:14px;text-align:center}
.photo-review-img{width:100%;max-width:100%;max-height:min(42dvh,320px);object-fit:contain;border-radius:14px;border:2px solid var(--line);background:#fafbfc;cursor:pointer}
.photo-info-banner{background:#f0f4f8;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;line-height:1.4}
.photo-info-banner b{color:var(--ink);font-weight:800}
.hl-word{display:inline;background:rgba(255,122,31,.3);border-radius:10px;padding:2px 8px;margin:0 2px;cursor:pointer;font-weight:800;position:relative}
.hl-word.hl-pulse{animation:hlPulse 1.8s ease-in-out infinite}
.hl-word.hl-static{cursor:default;animation:none}
@keyframes hlPulse{0%,100%{background:rgba(255,122,31,.22)}50%{background:rgba(255,122,31,.48)}}
.interp-line{display:block;margin-top:3px;font-size:12px;color:var(--ink-soft);font-weight:700;line-height:1.45}
.interp-text-edit{width:100%;margin-top:4px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;font-weight:700;font-size:13px}
.admin-verify-tip{background:#f5f7fa;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;line-height:1.5}
.interp-hint{background:#f5f7fa;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--ink-soft);line-height:1.55}
.interp-hint p{margin:0 0 6px}
.interp-hint p:last-child{margin-bottom:0}
.man-text-area{width:100%;min-height:120px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;line-height:1.45;resize:vertical;font-family:'Nunito',sans-serif}
.manual-import-block textarea:focus{outline:none;border-color:var(--green)}
.interp-loading{text-align:center;padding:20px 12px;color:var(--ink-soft);font-weight:700}
.interp-loading .spin{margin:0 auto 10px}
.hl-popover{position:fixed;z-index:55;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:200px;max-width:92vw}
.hl-popover button{border:none;background:#f5f7fa;padding:10px 12px;border-radius:10px;font-weight:700;font-size:13px;text-align:left;cursor:pointer;width:100%}
.hl-popover button:active{background:var(--green-soft)}
.hl-popover .hl-pop-field{padding:6px 4px}
.hl-popover .hl-pop-field input,.hl-popover .hl-pop-field select{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;font-weight:700;font-size:13px}
.incomplete-widget{display:flex;justify-content:center;margin:14px 0 10px}
.incomplete-badge{background:var(--red);color:#fff;font-family:'Fredoka';font-size:17px;font-weight:700;padding:10px 26px;border-radius:16px;box-shadow:0 4px 0 #b91c1c;letter-spacing:.3px}
.photo-only-banner{background:#f0f4f8;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;line-height:1.4}
@media(hover:hover){
  .mode-btn:hover{transform:translateY(-2px)}
  .mode-btn.voice:hover{border-color:var(--orange);box-shadow:0 5px 0 var(--orange-soft)}
  .mode-btn.photo:hover{border-color:var(--yellow-dark);box-shadow:0 5px 0 var(--yellow-soft)}
  .prod-row:hover{background:#fafbfc}
  .prod-row.selected:hover{background:var(--green-soft)}
}

.pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 0 4px;flex:0 0 auto}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#dfe4e9;transition:.2s}
.dot.on{background:var(--green);transform:scale(1.35)}
.pg-btn{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 #e6eaee;font-size:18px;font-family:'Fredoka'}
.pg-btn:active{transform:translateY(3px);box-shadow:none}
.pg-btn[disabled]{opacity:.35;pointer-events:none}

.cartbar{flex:0 0 auto;padding:6px 0 8px}
.cartbar .btn{font-size:16px;padding:14px 18px}
.cart-count{background:#fff;color:var(--green);border-radius:20px;padding:2px 10px;font-weight:700;font-size:14px}

/* ---------- nav inferior ---------- */
.nav{flex:0 0 auto;display:flex;gap:6px;background:#fff;border-top:2px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-soft);
  padding:6px 12px;border-radius:14px;transition:.15s;font-family:'Fredoka';min-width:60px}
.nav-btn .ni{font-size:22px;transition:transform .2s}
.nav-btn.on{color:var(--green);background:var(--green-soft)}
.nav-btn.on .ni{transform:scale(1.15)}
.nav-btn:active .ni{transform:scale(.85)}

/* ---------- modales ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,36,44,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.overlay.open{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:640px;max-height:88dvh;border-radius:26px 26px 0 0;padding:18px 18px calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;animation:sheetUp .35s cubic-bezier(.34,1.3,.5,1)}
@media(min-width:760px){.overlay{align-items:center}.sheet{border-radius:26px}}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}}
.sheet h2{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.sheet .body{overflow-y:auto;min-height:0;margin:12px 0}
.grab{width:44px;height:5px;border-radius:3px;background:#e3e7eb;margin:0 auto 12px}

/* ---------- revisión de pedido (voz/foto) ---------- */
.rev-row{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff;animation:pop .3s both}
.rev-row .re{font-size:26px}
.rev-row .rn{flex:1;min-width:0}
.rev-row .rn b{font-family:'Fredoka';font-weight:600;font-size:14.5px;display:block}
.rev-row .rn span{font-size:12px;color:var(--ink-soft);font-weight:700}
.rev-row select{border:2px solid var(--line);border-radius:10px;padding:7px;max-width:150px;font-weight:700}
.rev-row.warn{border-color:var(--orange);background:var(--orange-soft)}
.warn-note{display:flex;gap:10px;align-items:center;background:var(--orange-soft);border:2px solid var(--orange);
  border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;color:#8a4300;margin-bottom:10px;animation:pop .35s both}
.warn-note .wi{font-size:22px;animation:wiggle 1s infinite}
.mic-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.mic-circle{width:110px;height:110px;border-radius:50%;background:var(--orange);color:#fff;font-size:46px;display:grid;place-items:center;
  box-shadow:0 6px 0 var(--orange-dark);transition:.15s;position:relative}
.mic-circle:active{transform:translateY(6px);box-shadow:none}
.mic-circle.rec{animation:pulse 1.2s infinite}
.mic-circle.rec::before,.mic-circle.rec::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--orange);opacity:0;animation:ring 1.5s infinite}
.mic-circle.rec::after{animation-delay:.5s}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.45)}}
.transcript{width:100%;min-height:64px;border:2px dashed #d9dee4;border-radius:14px;padding:10px;font-size:15px;font-weight:600;color:var(--ink)}
.transcript:empty::before{content:attr(data-ph);color:#a9b2bb}
.transcript:focus{outline:none;border-color:var(--orange)}
.hints{background:var(--green-soft);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;color:#126030;width:100%}
.hints b{font-family:'Fredoka'}
.spin{width:46px;height:46px;border:5px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;margin:14px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- éxito ---------- */
.success-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.check-big{width:120px;height:120px;border-radius:50%;background:var(--green);color:#fff;font-size:62px;display:grid;place-items:center;
  box-shadow:0 8px 0 var(--green-dark);animation:bounceIn .7s cubic-bezier(.34,1.56,.5,1)}
.confetti{position:absolute;top:0;width:10px;height:14px;border-radius:3px;animation:cf 1.6s ease-out forwards}
@keyframes cf{from{transform:translateY(-10dvh) rotate(0)}to{transform:translateY(110dvh) rotate(720deg);opacity:0}}

/* ---------- admin ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px;border-radius:var(--r-md);border:2px solid var(--line);background:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .num{font-family:'Fredoka';font-size:30px;font-weight:700}
.stat .lbl{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px}
.stat::after{content:attr(data-ic);position:absolute;right:-6px;bottom:-10px;font-size:52px;opacity:.15}
.stat.g{border-color:#bfe9cd}.stat.g .num{color:var(--green)}
.stat.y{border-color:#f4df9a}.stat.y .num{color:#b98a00}
.stat.o{border-color:#ffd0ad}.stat.o .num{color:var(--orange)}
.list-row{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;animation:pop .3s both;transition:.15s}
@media(hover:hover){.list-row:hover{border-color:var(--green);transform:translateX(4px)}}
.list-row .le{font-size:26px}
.list-row .lt{flex:1;min-width:0}
.list-row .lt b{font-family:'Fredoka';font-weight:600;font-size:15px;display:block}
.list-row .lt span{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.chip{font-size:11px;font-weight:800;border-radius:20px;padding:3px 9px}
.chip.pend{background:var(--yellow-soft);color:#8a6a00}
.chip.cons{background:var(--green-soft);color:#126030}
.chip.cerr{background:#eef1f4;color:var(--ink-soft)}
.chip.anul{background:var(--red-soft);color:var(--red)}
.chip.exc{background:var(--orange-soft);color:#a34a00}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 #e6eaee;transition:.12s}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
@media(hover:hover){.icon-btn:hover{border-color:var(--green)}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;flex:0 0 auto;scrollbar-width:none}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:20px;background:#fff;border:2px solid var(--line);font-family:'Fredoka';font-weight:600;font-size:14px;color:var(--ink-soft);transition:.15s}
.tab.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-dark)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:800;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select{width:100%;padding:12px;border:2px solid var(--line);border-radius:13px;font-weight:700;background:#fff}
.field input:focus,.field select:focus{outline:none;border-color:var(--green)}
.consol-row{display:flex;flex-direction:column;gap:0;padding:0;border-radius:14px;border:2px solid var(--line);background:#fff;margin-bottom:8px;animation:pop .3s both;overflow:hidden}
.consol-row-main{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer}
.consol-row .ce{font-size:30px;flex-shrink:0}
.consol-row .cn{flex:1;min-width:0}
.consol-row .cn b{font-family:'Fredoka';font-size:15.5px;font-weight:600;display:block}
.consol-row .cq{font-family:'Fredoka';font-weight:700;font-size:19px;color:var(--green);flex-shrink:0}
.consol-row .cq small{font-size:11px;color:var(--ink-soft);display:block;text-align:right;font-family:'Nunito';font-weight:800}
.consol-nota-wrap{padding:0 12px 12px}
.consol-nota-in{width:100%;border:2px dashed var(--line);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;font-family:inherit}
.consol-shift-next{border-color:var(--green)!important;box-shadow:0 0 0 2px rgba(31,168,77,.15)}
.consol-shift-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.nota-admin-in{width:100%;margin-top:6px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;font-family:inherit}
.nav-badge{position:absolute;top:2px;right:2px;background:var(--orange);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;line-height:16px;border-radius:8px;text-align:center;padding:0 4px}
.admin-nav-inner .nav-btn{position:relative}
.detail-clients{width:100%;font-size:12.5px;font-weight:700;color:var(--ink-soft);padding:6px 0 0;border-top:1.5px dashed var(--line);margin-top:6px;display:none}
.consol-row.open .detail-clients{display:block;animation:fadeIn .25s}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink-soft);text-align:center;padding:20px}
.empty .ee{font-size:56px;animation:float 4s ease-in-out infinite}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-family:'Fredoka';
  font-weight:600;padding:12px 20px;border-radius:16px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.emoji-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emoji-pick button{font-size:28px;padding:8px;border-radius:12px;border:2px solid var(--line);transition:.12s;background:#fff}
.emoji-pick button.on{border-color:var(--green);background:var(--green-soft);transform:scale(1.1)}
.seg{display:flex;background:#f2f4f6;border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--ink-soft);transition:.15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.hist-day{margin-bottom:14px;animation:pop .35s both}
.hist-day h3{font-size:14px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:flex;gap:8px;align-items:center}

/* ---------- tarjetas pedido (operario/admin) ---------- */
.order-card{border-radius:var(--r-md);border:2px solid var(--line);padding:12px 14px;margin-bottom:8px;position:relative;overflow:hidden}
.order-card.order-needs-pricing{animation:orderPricePulse 2.6s ease-in-out infinite}
@keyframes orderPricePulse{0%,100%{box-shadow:0 0 0 0 rgba(31,168,77,0);border-color:var(--line)}50%{box-shadow:0 0 0 5px rgba(31,168,77,.22);border-color:rgba(31,168,77,.55)}}
.order-listo-corner{position:absolute;bottom:0;right:0;width:0;height:0;border-style:solid;border-width:0 0 50px 50px;border-color:transparent transparent #0d6b32 transparent;pointer-events:none;z-index:2}
.order-listo-corner span{position:absolute;bottom:-42px;right:2px;display:block;font-size:8.5px;font-weight:800;color:#fff;letter-spacing:.08em;transform:rotate(-45deg);font-family:'Nunito',sans-serif;white-space:nowrap}
.oc-head{display:flex;align-items:flex-start;gap:10px}
.oc-emoji{font-size:28px;line-height:1}
.oc-title{flex:1;min-width:0}
.oc-title b{font-family:'Fredoka';font-size:15px;display:block}
.oc-title>span{font-size:12px;color:var(--ink-soft);font-weight:700;display:block;margin-top:2px}
.oc-preview{font-size:12px;color:var(--ink);font-weight:700;display:block;margin-top:4px}
.oc-op{font-size:11px;color:#999;font-weight:700;display:block;margin-top:3px}
.acomodando-pulse{font-size:12px;font-weight:800;color:#8a6a00;animation:pulse 1.2s ease infinite;display:block;margin-top:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- filtros deslizables ---------- */
.filter-scroll{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;
  padding:4px 2px 10px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.filter-chip{flex:none;scroll-snap-align:start;padding:8px 14px;border-radius:20px;border:2px solid var(--line);
  background:#fff;font-family:'Fredoka';font-weight:600;font-size:12px;color:var(--ink-soft);white-space:nowrap;max-width:min(92vw,320px);overflow:hidden;text-overflow:ellipsis}
.filter-chip.on{background:var(--green-soft);border-color:var(--green);color:var(--green-dark)}

/* ---------- detalle pedido pantalla completa (admin) ---------- */
.order-detail-wrap{display:flex;flex-direction:column;min-height:0;flex:1;overflow-x:hidden;max-width:100%}
.order-detail-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(100px + env(safe-area-inset-bottom));max-width:100%}
.order-detail-hero{width:100%;margin:0 0 12px;position:relative;background:#f5f7fa;border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.order-detail-hero img{width:100%;max-height:min(72dvh,620px);min-height:min(42dvh,320px);object-fit:contain;display:block;cursor:pointer;background:#eef1f4}
.order-detail-hero-lg img{max-height:min(78dvh,680px);min-height:min(48dvh,360px)}
.order-detail-meta{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:12px;line-height:1.45}
.order-detail-bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:640px;margin:0 auto;background:#fff;border-top:2px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.08)}
.order-detail-total-bar{display:none;padding:12px 16px 10px;background:linear-gradient(180deg,var(--green-soft),#fff);border-bottom:1px dashed var(--line);align-items:center;justify-content:space-between;gap:10px}
.order-detail-total-bar.show{display:flex}
.order-detail-total-bar .total-lbl{font-size:13px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.order-detail-total-bar .total-amt{font-family:'Fredoka';font-size:clamp(26px,7vw,34px);font-weight:700;color:var(--green-dark);line-height:1}
.order-detail-foot-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;background:#fff}
.order-detail-foot-scroll::-webkit-scrollbar{display:none}
.order-detail-foot-inner{display:flex;gap:8px;min-width:min-content;padding:8px 14px calc(8px + env(safe-area-inset-bottom));align-items:stretch}
.order-detail-foot-inner .btn{flex:0 0 auto;white-space:nowrap;font-size:14px;padding:11px 16px;min-width:auto;pointer-events:auto}
.order-detail-foot-inner .btn.btn-lg{flex:0 0 auto;min-width:auto;font-size:15px;font-weight:700;padding:12px 18px}
.order-detail-foot-inner .btn.ghost.sm{font-size:13px;padding:9px 12px;opacity:.9}
.role-top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-right:2px}
#v-order .topbar>div:first-child,#v-history .topbar>div:first-child,#v-worker .topbar>div:first-child{min-width:0;flex:1}
#v-order .topbar h1,#v-history .topbar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .back-btn{font-size:22px;width:44px;height:44px;border-radius:12px;background:#fff;border:2px solid var(--line)}

/* ---------- sub-vistas admin (sin scroll horizontal) ---------- */
.subview-wrap{display:flex;flex-direction:column;min-height:0;flex:1;overflow-x:hidden;max-width:100%}
.subview-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:88px;max-width:100%}
.subview-foot{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:640px;margin:0 auto;
  display:flex;flex-wrap:wrap;gap:7px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.92) 18%,#fff 36%);
  border-top:1px solid rgba(0,0,0,.06)}
.subview-foot .btn{font-size:15.2px;padding:13px 17px;flex:1;min-width:calc(50% - 4px)}
.man-row{display:flex;flex-direction:column;gap:8px;padding:10px;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff;max-width:100%}
.man-row-fields{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:100%}
.man-row-fields select{flex:1;min-width:0;max-width:100%;border:2px solid var(--line);border-radius:10px;padding:8px;font-weight:700}
.man-row-fields .qty-in{width:72px;flex:none}
.rev-row{max-width:100%;overflow:hidden}
.rev-row select{max-width:min(100%,200px);min-width:0}
.billing-trial{background:var(--green-soft);border:1.5px solid var(--green);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--green-dark);margin-bottom:12px}
.billing-expired{background:#f0f4f8;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:12px;text-align:center}
.remision-doc{overflow-x:auto;max-width:100%}
.remision-doc>div{min-width:0;max-width:100%}

/* ---------- dashboard rediseñado ---------- */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:760px){.dash-grid{grid-template-columns:1.2fr 1fr 1fr 1fr}}
.dash-ring{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:16px}
@media(min-width:760px){.dash-ring{grid-column:span 1;flex-direction:column;text-align:center}}
.progress-ring{width:100px;height:100px;flex:none}
.ring-label{font-family:'Fredoka';font-size:18px;line-height:1.2}
.ring-label span{display:block;font-size:13px;color:var(--ink-soft);font-family:'Nunito';font-weight:700;margin-top:4px}
.dash-stat{padding:14px;text-align:center}
.ds-num{font-family:'Fredoka';font-size:26px;font-weight:700;line-height:1.1}
.ds-lbl{font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:4px}
.dash-stat.y .ds-num{color:var(--yellow-dark)}
.dash-stat.o .ds-num{color:var(--orange)}
.dash-stat.g .ds-num{color:var(--green)}

/* ---------- precios / remisión ---------- */
.price-total-box{background:rgba(31,168,77,.12);border-radius:10px;padding:6px 10px;margin-top:6px;
  font-weight:800;font-size:13px;color:var(--green-dark);display:inline-block}
.price-total-box.pending{background:rgba(255,122,31,.12);color:var(--orange-dark)}
.cart-extra-actions{padding:6px 0 4px}
.cart-extra-actions .btn{font-size:14px;padding:11px 14px}
.unit-custom-in{width:100%;margin-top:5px;border:2px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px}
.order-detail-total-bar .total-sub{font-size:12px;font-weight:800;color:var(--orange-dark);display:block;margin-top:2px}

/* ---------- notificaciones ---------- */
.notif-fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;
  width:56px;height:56px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:var(--shadow);
  font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.notif-badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;
  background:var(--red);color:#fff;font-size:11px;font-weight:800;font-family:'Nunito';
  display:grid;place-items:center;padding:0 5px;animation:nbpulse 1.5s ease infinite}
@keyframes nbpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.notif-row{padding:12px;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff}

/* ---------- admin top actions / nav scroll / chat ---------- */
.admin-top-actions,.admin-top-actions-sub{display:flex;align-items:center;gap:8px;margin-right:4px}
.top-action-btn{position:relative;width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;
  font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.top-action-btn.sm{width:38px;height:38px;font-size:20px}
.top-action-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);
  color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.notif-fab.worker-fab{left:auto;right:16px;bottom:calc(16px + env(safe-area-inset-bottom))}
.client-chat-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;
  width:56px;height:56px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:var(--shadow);
  font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.admin-nav-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;justify-content:flex-start;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x}
.admin-nav-scroll::-webkit-scrollbar{display:none}
.admin-nav-inner{display:flex;gap:6px;min-width:min-content;padding:0 2px}
.admin-nav-scroll .nav-btn{flex:0 0 auto;min-width:54px;font-size:10px;padding:5px 6px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;user-select:none}
.admin-nav-scroll .nav-btn .ni{font-size:18px}
.compact-nav .nav-btn{min-width:52px;font-size:10px;padding:5px 8px}
.compact-nav .nav-btn .ni{font-size:18px}
.client-nav-scroll,.worker-nav-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;justify-content:flex-start;scrollbar-width:none}
.client-nav-scroll::-webkit-scrollbar,.worker-nav-scroll::-webkit-scrollbar{display:none}
.client-nav-inner,.worker-nav-inner{display:flex;gap:4px;min-width:min-content;padding:0 2px;width:100%;justify-content:flex-start}
.client-nav-scroll .nav-btn,.worker-nav-scroll .nav-btn{flex:0 0 auto}
.dash-grid-5{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:760px){.dash-grid-5{grid-template-columns:1.1fr 1fr 1fr 1fr 1fr}}
.dash-stat.p{background:linear-gradient(135deg,#f3e8ff,#fff);border-color:#d8b4fe}
.prov-group-card{border:2px solid var(--line)}
.prov-group-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.prov-group-head .wa-order-btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.consol-row-actions{padding:0 12px 10px}
.prov-prod-grid{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow-y:auto;padding:4px 0}
.prov-prod-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:6px 10px;border:2px solid var(--line);border-radius:999px;cursor:pointer;background:#fff}
.prov-prod-chip input{display:none}
.prov-prod-chip.on{background:var(--green-soft);border-color:var(--green);color:var(--green-dark)}

<script>
/* ============================================================
   FRUVER PEDIDOS — SPA demo (fase de prototipo de interfaz)
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const todayStr=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>new Date(d+"T12:00").toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
const nowTime=()=>new Date().toTimeString().slice(0,5);
function fmtTime12(t){
  if(!t) return '';
  const m=String(t).match(/^(\d{1,2}):(\d{2})/);
  if(!m) return t;
  let h=+m[1], min=m[2];
  const ap=h>=12?'pm':'am';
  h=h%12; if(h===0) h=12;
  return `${h}:${min} ${ap}`;
}
function normTxtSimple(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function orderPreview(o,max=3){
  if(o.photoOnly&&!o.items?.length) return 'Pedido por foto (pendiente de transcribir)';
  const names=(o.items||[]).map(it=>typeof itemProductName==='function'?itemProductName(it):(DB?.products?.find(x=>x.id===it.p)?.name||null)).filter(Boolean);
  if(!names.length) return 'Sin productos identificados';
  const shown=names.slice(0,max).join(', ');
  const extra=names.length-max;
  return shown+(extra>0?` +${extra} más`:'');
}
const uid=()=> 'x'+Math.random().toString(36).slice(2,9);
const aiCfg=()=>window.FRUVER_CONFIG||{};
const openaiKey=()=>aiCfg().openaiApiKey||'';
const openaiModel=()=>aiCfg().openaiModel||'gpt-4o-mini';
async function callOpenAI(messages,maxTokens=2500){
  const res=await fetch('/api/interpret',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages,maxTokens}),
  });
  const data=await res.json();
  if(res.ok) return data.content?.trim()||'';
  const key=openaiKey();
  if(!key) throw new Error(data.error||'IA no disponible');
  const direct=await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},
    body:JSON.stringify({model:openaiModel(),max_tokens:maxTokens,messages,temperature:0.1}),
  });
  const d2=await direct.json();
  if(!direct.ok) throw new Error(d2.error?.message||data.error||'openai-error');
  return d2.choices?.[0]?.message?.content?.trim()||'';
}

/* ---------- datos semilla ---------- */
const SEED_PRODUCTS=typeof buildSeedProducts==='function'?buildSeedProducts():[];
const SEED_WORKERS=[
 {id:'w1',name:'Carlos',username:'carlos',password:'carlos1',avatarEmoji:'👨‍🌾',activo:true},
 {id:'w2',name:'María',username:'maria',password:'maria1',avatarEmoji:'👩‍🌾',activo:true},
];
const SEED_ADMIN={username:'olga',password:'1234',name:'Olga'};
const SEED_CLIENTS=[
 {id:'c1',name:'Restaurante La Terraza',type:'restaurante',phone:'3001112233',address:'Cra 45 #10-20',emoji:'🍽️',username:'terraza',password:'terraza1'},
 {id:'c2',name:'Hotel Carretero',type:'hotel',phone:'3014445566',address:'Calle 70 #22-15',emoji:'🏨',username:'carretero',password:'carretero1'},
 {id:'c3',name:'Gastrobar El Solar',type:'gastrobar',phone:'3027778899',address:'Av. Nutibara #33-08',emoji:'🍸',username:'solar',password:'solar1'},
];
function orderShift(time){
  const [h,m]=(time||'12:00').split(':').map(Number);
  const mins=h*60+(m||0);
  return mins>=840?'madrugada':'manana';
}
function shiftLabel(s){return s==='madrugada'?'🌙 Compra madrugada (3–6 am)':'☀️ Turno mañana';}
function fmtCutoffLabel(){
  if(DB?.config?.cutoff==='23:59'||DB?.config?.cutoff==='00:00') return '12 am (medianoche)';
  return fmtTime12(DB.config.cutoff);
}
function seedOrders(){
  const days=[-1,-2,-3,-5,-7]; const out=[];
  const mk=(cid,dOff,items,time,desc,del)=>{const d=new Date();d.setDate(d.getDate()+dOff);
    out.push({id:uid(),clientId:cid,date:d.toISOString().slice(0,10),time:time||'07:30',
      channel:'app',status:'cerrado',description:desc||'',deliveryTime:del||'07:00',shift:orderShift(time||'07:30'),
      items:items.map(it=>({p:it.p,q:it.q,u:it.u||'kilo'}))});};
  mk('c1',-1,[{p:'papa',q:2,u:'kilo'},{p:'tomate-chonto',q:1,u:'kilo'},{p:'cilantro',q:5,u:'unidad'}]);
  mk('c1',-2,[{p:'papa',q:2,u:'kilo'},{p:'tomate-chonto',q:2,u:'kilo'},{p:'zanahoria',q:6,u:'kilo'}]);
  mk('c2',-1,[{p:'aguacate',q:2,u:'unidad'},{p:'limon',q:10,u:'kilo'},{p:'papa',q:1,u:'kilo'}],'19:30','Pedido cena','06:00');
  mk('c3',-1,[{p:'limon',q:4,u:'kilo'},{p:'pimenton',q:3,u:'kilo'},{p:'lechuga-batavia',q:12,u:'unidad'}]);
  return out;
}

/* ---------- base de datos (API Neon Postgres en producción) ---------- */
let DB=null, dbUpdatedAt=null, syncTimer=null, saveT=null, saving=false;
const API_DB='/api/db';

function defaultDB(){
  return {products:SEED_PRODUCTS,clients:SEED_CLIENTS,workers:SEED_WORKERS,orders:seedOrders(),purchases:[],audit:[],config:{cutoff:'16:00',remisionNext:12588},admin:{...SEED_ADMIN},invitations:[],notifications:[],remisiones:[],vocabulario:[],suscripciones:[]};
}

async function loadDB(force=false){
  try{
    const res=await fetch(API_DB,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const {data,updatedAt}=await res.json();
    if(data){
      const serverTs=updatedAt?String(updatedAt):null;
      if(!force&&dbUpdatedAt&&serverTs===dbUpdatedAt) return false;
      DB=data; dbUpdatedAt=serverTs; migrateDB(); return true;
    }
    DB=defaultDB(); migrateDB(); await flushSave(); return true;
  }catch(e){
    console.error('loadDB',e);
    if(!DB){DB=defaultDB();migrateDB();}
    return false;
  }
}

async function flushSave(){
  clearTimeout(saveT);
  if(!DB||saving) return;
  saving=true;
  try{
    const res=await fetch(API_DB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(DB)});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j=await res.json();
    if(j.updatedAt) dbUpdatedAt=String(j.updatedAt);
  }catch(e){
    console.error('saveDB',e);
    toast('Error al guardar en el servidor');
  }finally{saving=false;}
}

function saveDB(){
  clearTimeout(saveT);
  saveT=setTimeout(flushSave,350);
}

function refreshCurrentView(){
  if(!session) return;
  if(session.role==='admin'){
    const active=$('.view.active')?.id;
    if(active==='v-admin') adminNav(adminTab);
    else if(typeof renderAdminTopActions==='function') renderAdminTopActions();
  }
  else if(session.role==='worker'){
    if($('#v-worker-acomodo')?.classList.contains('active')&&typeof renderWorkerAcomodoPage==='function') renderWorkerAcomodoPage();
    else renderWorker();
  }
  else if(session.role==='client'){
    if($('#v-order')?.classList.contains('active')) renderClientOrder();
    if($('#v-history')?.classList.contains('active')) renderHistory();
    if($('#v-chat')?.classList.contains('active')&&typeof renderChatPage==='function') renderChatPage();
  }
}

function startSync(){
  stopSync();
  syncTimer=setInterval(async()=>{
    const changed=await loadDB();
    if(changed) refreshCurrentView();
  },4000);
}
function stopSync(){if(syncTimer){clearInterval(syncTimer);syncTimer=null;}}
function migrateDB(){
  if(!DB.admin) DB.admin={...SEED_ADMIN};
  if(!DB.workers) DB.workers=SEED_WORKERS.map(w=>({...w}));
  if(!DB.purchases) DB.purchases=[];
  if(!DB.invitations) DB.invitations=[];
  if(!DB.notifications) DB.notifications=[];
  if(!DB.remisiones) DB.remisiones=[];
  if(!DB.vocabulario) DB.vocabulario=[];
  if(!DB.suscripciones) DB.suscripciones=[];
  if(!DB.compraNotas) DB.compraNotas=[];
  if(!DB.proveedores) DB.proveedores=[];
  if(!DB.compraProveedorOverrides) DB.compraProveedorOverrides=[];
  if(!DB.config) DB.config={cutoff:'23:59',remisionNext:12588};
  if(DB.config.cutoff==='16:00') DB.config.cutoff='23:59';
  if(!DB.config.remisionNext) DB.config.remisionNext=12588;
  if(!DB.preciosDia) DB.preciosDia={};
  if(!DB.solicitudes) DB.solicitudes=[];
  if(!DB.conversaciones) DB.conversaciones=[];
  if(!DB.mensajes) DB.mensajes=[];
  const hasOldCatalog=DB.products.some(p=>/^p\d+$/.test(p.id));
  if(hasOldCatalog||DB.products.length<40){
    DB.products=typeof buildSeedProducts==='function'?buildSeedProducts():SEED_PRODUCTS;
  }
  DB.products.forEach(p=>{delete p.unit; if(!p.unidad_sugerida) p.unidad_sugerida='kilo';});
  const defaults={c1:{username:'terraza',password:'terraza1'},c2:{username:'carretero',password:'carretero1'},c3:{username:'solar',password:'solar1'}};
  DB.clients.forEach(c=>{
    delete c.exception;
    if(!c.username) c.username=defaults[c.id]?.username||slugUsername(c.name);
    if(!c.password) c.password=defaults[c.id]?.password||(c.username+'1');
  });
  const statusMap={pesado:'acomodado',facturado:'remisionado',consolidado:'cerrado'};
  DB.orders.forEach(o=>{
    o.description=o.description||'';
    o.deliveryTime=o.deliveryTime||'';
    o.shift=o.shift||orderShift(o.time);
    if(statusMap[o.status]) o.status=statusMap[o.status];
    if(o.weighedBy&&!o.operarioId){
      const w=DB.workers.find(x=>x.name===o.weighedBy);
      if(w) o.operarioId=w.id;
    }
    if(o.weighedAt&&!o.acomodoFinalizadoEn) o.acomodoFinalizadoEn=o.weighedAt;
    o.items=(o.items||[]).map(it=>({p:it.p,q:it.q,u:it.u||'kilo',uCliente:it.uCliente||null,nombreLibre:it.nombreLibre||'',equivNote:it.equivNote||'',notaAdmin:it.notaAdmin||it.nota_admin||'',variacion:it.variacion||'',valorPedido:it.valorPedido??null,qKg:it.qKg??null,w:it.w??null,wUnit:it.wUnit||null,unitPrice:it.unitPrice??null,priceUnit:it.priceUnit||it.u||'kilo',total:it.total??null}));
    if(o.status==='pendiente'&&o.adminConfirmado===false&&!o.operarioId&&!o.remisionNo&&!o.acomodoIniciadoEn){
      o.status='por_confirmar';
    }
    delete o.adminConfirmado;
    delete o.adminConfirmadoEn;
    delete o.adminConfirmadoPor;
  });
  if(typeof applyCatalogExtensions==='function') applyCatalogExtensions();
}

/* ---------- sesión y navegación ---------- */
const SESSION_KEY='fruver_session_v1';
let session=null;
function saveSession(){
  if(!session){try{localStorage.removeItem(SESSION_KEY);}catch(e){}return;}
  const payload={...session,savedAt:Date.now()};
  if(session.role==='admin') payload.adminTab=adminTab;
  if(session.role==='client'){
    const on=$('[data-nav].on');
    payload.clientNav=on?on.dataset.nav:'order';
  }
  try{localStorage.setItem(SESSION_KEY,JSON.stringify(payload));}catch(e){}
}
function validateStoredSession(data){
  if(!data?.role) return null;
  if(data.role==='admin'){
    const admin=DB.admin||SEED_ADMIN;
    if(data.name===admin.name) return {role:'admin',name:admin.name};
  }
  if(data.role==='worker'){
    const w=(DB.workers||[]).find(x=>x.id===data.id&&x.activo!==false);
    if(w) return {role:'worker',id:w.id,name:w.name};
  }
  if(data.role==='client'){
    const c=DB.clients.find(x=>x.id===data.id);
    if(c) return {role:'client',id:c.id,name:c.name};
  }
  return null;
}
function restoreSession(){
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(!raw) return false;
    const data=JSON.parse(raw);
    session=validateStoredSession(data);
    if(!session){localStorage.removeItem(SESSION_KEY);return false;}
    startSync();
    if(session.role==='admin'){
      adminTab=data.adminTab==='solicitudes'?'dash':(data.adminTab||'dash');
      adminNav(adminTab);
      showView('v-admin');
    }else if(session.role==='worker'){
      $('#workerSub').textContent=fmtDate(todayStr());
      renderWorker();
      showView('v-worker');
    }else{
      cart={};
      nav(data.clientNav||'order');
    }
    return true;
  }catch(e){
    console.error('restoreSession',e);
    return false;
  }
}

/* ---------- login ---------- */
function slugUsername(name){
  return name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24)||'cliente';
}
function usernameTaken(username,opts={}){
  const u=username.toLowerCase();
  if((DB.admin||SEED_ADMIN).username?.toLowerCase()===u) return 'administradora';
  const cw=DB.workers?.find(w=>w.username?.toLowerCase()===u&&w.id!==opts.workerId);
  if(cw) return 'operario '+cw.name;
  const cc=DB.clients?.find(c=>c.username?.toLowerCase()===u&&c.id!==opts.clientId);
  if(cc) return 'cliente '+cc.name;
  return null;
}
function resetLoginForm(){
  const u=$('#loginUser'),p=$('#loginPass');
  if(u) u.value=''; if(p) p.value='';
}
function doLogin(){
  const user=$('#loginUser').value.trim().toLowerCase();
  const pass=$('#loginPass').value;
  if(!user||!pass){toast('Ingresa usuario y contraseña');return;}
  const admin=DB.admin||SEED_ADMIN;
  if(user===admin.username.toLowerCase()&&pass===admin.password){
    session={role:'admin',name:admin.name}; saveSession(); startSync(); adminNav('dash'); showView('v-admin'); return;
  }
  const worker=(DB.workers||[]).find(w=>w.username?.toLowerCase()===user&&w.password===pass);
  if(worker){
    session={role:'worker',id:worker.id,name:worker.name}; saveSession(); startSync(); $('#workerSub').textContent=fmtDate(todayStr()); renderWorker(); showView('v-worker'); return;
  }
  const client=DB.clients.find(c=>c.username?.toLowerCase()===user&&c.password===pass);
  if(client){
    session={role:'client',id:client.id,name:client.name}; saveSession(); startSync(); cart={}; nav('order'); return;
  }
  $('#loginPass').value='';
  $('#loginPass').closest('.field').classList.add('wiggle');
  setTimeout(()=>$('#loginPass').closest('.field').classList.remove('wiggle'),500);
  toast('Usuario o contraseña incorrectos');
}

function clientProductSearchMatch(p,query){
  const n=normTxtSimple(query);
  if(!n) return {match:true,hint:null};
  const pn=normTxtSimple(p.name);
  if(pn.includes(n)||n.split(/\s+/).some(w=>w.length>2&&pn.includes(w))) return {match:true,hint:null};
  const aliasHit=(DB.vocabulario||[]).find(v=>v.tipo==='producto'&&v.producto_id===p.id&&(
    normTxtSimple(v.texto_alias).includes(n)||n.includes(normTxtSimple(v.texto_alias))
  ));
  if(aliasHit) return {match:true,hint:`¿Buscabas ${p.name}? (${aliasHit.texto_alias})`};
  return {match:false,hint:null};
}
function productsForClientView(list){
  const n=normTxtSimple(clientSearchQuery);
  if(!n) return list.map(p=>({p,hint:null}));
  const out=[], seen=new Set();
  list.forEach(p=>{
    const m=clientProductSearchMatch(p,clientSearchQuery);
    if(m.match){out.push({p,hint:m.hint});seen.add(p.id);}
  });
  (DB.vocabulario||[]).filter(v=>v.tipo==='producto').forEach(v=>{
    const alias=normTxtSimple(v.texto_alias);
    if((alias.includes(n)||n.includes(alias))&&v.producto_id&&!seen.has(v.producto_id)){
      const p=list.find(x=>x.id===v.producto_id);
      if(p&&p.active){out.push({p,hint:`"${v.texto_alias}" → ${p.name}`});seen.add(p.id);}
    }
  });
  return out;
}

async function submitOrder(clientId,channel,fromAdmin=false,deliveryTime='',description='',opts={}){
  const items=Object.entries(cart).filter(([,v])=>v.q>0).map(([pid,v])=>{
    const isCustom=v.isCustom||String(pid).startsWith('__custom_');
    const u=v.u==='__otro__'?'unidad':(v.u||'kilo');
    const uCliente=v.u==='__otro__'?(v.uCliente||'unidad'):(v.uCliente||null);
    const it=isCustom?{
      p:typeof CUSTOM_PRODUCT_ID!=='undefined'?CUSTOM_PRODUCT_ID:'__libre__',
      q:+v.q,u,w:null,unitPrice:null,priceUnit:u==='valor'?'kilo':u,total:null,
      variacion:v.variacion||'',uCliente:uCliente||fmtUnit(u),nombreLibre:v.nombreLibre||'',
    }:{
      p:pid,q:+v.q,u,w:null,unitPrice:null,priceUnit:u==='valor'?'kilo':u,total:null,
      variacion:v.variacion||'',uCliente:uCliente||fmtUnit(u),
    };
    if(u==='valor') it.valorPedido=+v.q;
    return it;
  });
  if(!items.length)return;
  const t=nowTime();
  const orderId=uid();
  const delDate=typeof deliveryDateForOrder==='function'?deliveryDateForOrder(t):todayStr();
  DB.orders.unshift({id:orderId,clientId,date:todayStr(),time:t,channel,status:'por_confirmar',
    description:description||'',deliveryTime:deliveryTime||'',deliveryDate:delDate,
    shift:orderShift(t),items,entregaUrgente:!!opts.urgent});
  if(opts.urgent&&typeof sendUrgentRequestViaChat==='function'){
    sendUrgentRequestViaChat({clientId,orderId,mensaje:'🚨 Solicito entrega lo antes posible · '+fmtTime12(deliveryTime||t)});
  }
  audit('Creó pedido',`${clientName(clientId)} · ${items.length} productos · ${shiftLabel(orderShift(t))}${opts.urgent?' · URGENTE':''}`);
  cart={}; closeSheet();
  await flushSave();
  if(fromAdmin){toast('Pedido registrado ✅');adminNav('orders');}
  else{
    const afterCut=cutoffPassed();
    const prefix=afterCut?'Tu pedido quedó registrado para':'Tu pedido quedó registrado — Olga lo confirmará pronto. Entrega';
    $('#successMsg').textContent=`${prefix} ${fmtDate(delDate)}.${opts.urgent?' Le enviamos tu solicitud urgente a Olga por chat para entrega esta mañana.':''} Puedes hacer otro pedido hoy si lo necesitas.`;
    launchConfetti(); showView('v-success');
  }
}

function toggleRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Tu navegador no soporta dictado 😕 Escribe el pedido en el recuadro');return;}
  if(recActive){stopRecognition();return;}
  recog=new SR(); recog.lang='es-CO'; recog.continuous=true; recog.interimResults=true;
  let base=$('#transcript').textContent.trim();
  recog.onresult=e=>{let fin='',int='';
    for(let i=0;i<e.results.length;i++){(e.results[i].isFinal?fin+=e.results[i][0].transcript:int+=e.results[i][0].transcript);}
    $('#transcript').textContent=(base+' '+fin+' '+int).trim();};
  recog.onend=()=>{recActive=false;const b=$('#micBtn');if(b){b.classList.remove('rec');b.textContent='🎙️';}const l=$('#micLbl');if(l)l.textContent='Toca para dictar de nuevo';};
  recog.onerror=()=>toast('No pude escucharte, intenta otra vez');
  recog.start(); recActive=true;
  $('#micBtn').classList.add('rec'); $('#micBtn').textContent='⏹️'; $('#micLbl').textContent='Escuchando… habla con calma';
}

/* respaldo local sin IA (voz) */
function localParse(text){
  const nums={'un':1,'una':1,'uno':1,'dos':2,'tres':3,'cuatro':4,'cinco':5,'seis':6,'siete':7,'ocho':8,'nueve':9,'diez':10,'media':0.5};
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const parts=norm(text).split(/,| y |\n|;|\./).map(s=>s.trim()).filter(Boolean);
  return parts.map(seg=>{
    let q=1; const mNum=seg.match(/\d+/); if(mNum)q=+mNum[0];
    else{for(const w in nums)if(seg.includes(w+' ')){q=nums[w];break;}}
    let best=null,score=0;
    activeProducts().forEach(p=>{
      const words=norm(p.name).split(' ');
      const hit=words.filter(w=>w.length>3&&seg.includes(w)).length/words.length;
      if(hit>score){score=hit;best=p;}
    });
    return {texto:seg,productId:best?best.id:null,cantidad:q,unidad:seg.includes('gram')?'gramo':seg.includes('und')||seg.includes('unidad')||seg.includes('rollo')?'unidad':'kilo',confianza:best?(score>=1?0.97:0.7):0.2};
  }).filter(x=>x.texto);
}

  const em=EMOJIS.map(e=>`<button type="button" class="${e===window.formEmoji?'on':''}" onclick="pickEmoji(this,'${e}')">${e}</button>`).join('');
  openSheet(id?'✏️ Editar producto':'➕ Nuevo producto',`
    <div class="field"><label>Nombre</label><input id="pfName" value="${p.name}" placeholder="Ej.: Papa criolla"></div>
    <div class="field"><label>Imagen del producto</label>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <div id="pfPrev" style="width:56px;height:56px;border:2px solid var(--line);border-radius:14px;display:grid;place-items:center;font-size:30px;overflow:hidden">${p.img?`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover">`:window.formEmoji}</div>
        <input type="file" id="pfPhoto" accept="image/*" capture="environment" style="display:none" onchange="productPhoto(this)">
        <button class="btn ghost sm" type="button" onclick="document.getElementById('pfPhoto').click()">📷 Tomar foto</button>
        <button class="btn yellow sm" type="button" onclick="suggestEmojiAI()">✨ Sugerir con IA</button>
      </div>
      <div class="emoji-pick">${em}</div>
    </div>
    <div class="field"><label>Unidad sugerida (default catálogo)</label>
      <select id="pfUnit">${['kilo','gramo','unidad'].map(u=>`<option value="${u}" ${(p.unidad_sugerida||'kilo')===u?'selected':''}>${u==='kilo'?'Kilo (kg)':u==='gramo'?'Gramo (g)':'Unidad'}</option>`).join('')}</select></div>`,
    [{label:'💾 Guardar',cls:'green',fn:()=>{
      const name=$('#pfName').value.trim();
      if(!name){toast('Escribe el nombre del producto');return;}
      const dup=DB.products.find(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==id);
      if(dup){toast('Ya existe "'+name+'"');return;}
      if(id){Object.assign(p,{name,emoji:window.formEmoji,img:window.formImg,unidad_sugerida:$('#pfUnit').value});audit('Editó producto',name);}
      else{DB.products.push({id:uid(),name,emoji:window.formEmoji,img:window.formImg,unidad_sugerida:$('#pfUnit').value,tint:'#E8F8EE',edge:'#1FA84D',active:true});audit('Creó producto',name);}
      saveDB(); closeSheet(); renderCatalog(); toast('Producto guardado ✅');
    }}]);
}
function pickEmoji(btn,e){window.formEmoji=e;window.formImg=null;$$('.emoji-pick button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');$('#pfPrev').innerHTML=e;}
function productPhoto(inp){
  const f=inp.files[0]; if(!f)return;
  const img=new Image(); img.onload=()=>{
    const cv=document.createElement('canvas'); const s=220; cv.width=s;cv.height=s;
    const m=Math.min(img.width,img.height);
    cv.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
    window.formImg=cv.toDataURL('image/jpeg',.8);
    $('#pfPrev').innerHTML=`<img src="${window.formImg}" style="width:100%;height:100%;object-fit:cover">`;
  };
  img.src=URL.createObjectURL(f);
}
async function suggestEmojiAI(){
  const name=$('#pfName').value.trim();
  if(!name){toast('Escribe primero el nombre del producto');return;}
  toast('✨ Pidiendo sugerencia a la IA…');
  try{
    const txt=await callOpenAI([{role:'user',content:`Devuelve SOLO un emoji (un único caracter emoji, nada más) que represente mejor este producto de plaza de mercado: "${name}"`}],20);
    const e=txt.split(/\s/)[0];
    if(e){window.formEmoji=e;window.formImg=null;$('#pfPrev').innerHTML=e;toast('Ícono sugerido: '+e);}
  }catch(err){toast('No se pudo consultar la IA, elige un ícono manual');}
}

/* ---------- clientes ---------- */
function renderClients(){
  $('#adminBody').innerHTML=`
    <button class="btn green block pop" style="margin-bottom:10px" onclick="openClientForm()">➕ Nuevo cliente</button>
    ${DB.clients.map((c,i)=>`
      <div class="list-row" style="animation-delay:${i*40}ms">
        <span class="le">${c.emoji||'🏪'}</span>
        <div class="lt"><b>${c.name}</b>
        <span>${c.type} · 👤 ${c.username||'—'} · 📱 ${c.phone} · 📍 ${c.address||'—'}</span></div>
        <button class="icon-btn" onclick="clientHistoryAdmin('${c.id}')">📋</button>
        <button class="icon-btn" onclick="openClientForm('${c.id}')">✏️</button>
      </div>`).join('')}`;
}
function openClientForm(id){
  const c=id?DB.clients.find(x=>x.id===id):{name:'',type:'restaurante',phone:'',address:'',username:'',password:''};
  const defaultUser=c.username||(!id&&c.name?slugUsername(c.name):'');
  openSheet(id?'✏️ Editar cliente':'➕ Nuevo cliente',`
    <div class="field"><label>Nombre o razón social</label><input id="cfName" value="${c.name}" oninput="if(!${id?'true':'false'}&&!$('#cfUser').dataset.touched){$('#cfUser').value=slugUsername(this.value)}"></div>
    <div class="field"><label>Tipo</label><select id="cfType">${['hotel','restaurante','gastrobar','otro'].map(t=>`<option ${t===c.type?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Teléfono / WhatsApp</label><input id="cfPhone" inputmode="numeric" value="${c.phone}" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
    <div class="field"><label>Dirección de entrega</label><input id="cfAddr" value="${c.address||''}"></div>
    <div class="field"><label>Usuario de acceso</label><input id="cfUser" value="${defaultUser}" placeholder="Ej.: la-terraza" oninput="this.dataset.touched='1'"></div>
    <div class="field"><label>Contraseña</label><input id="cfPass" type="password" value="" placeholder="${id?'Dejar vacío para no cambiar':'Contraseña inicial'}"></div>`,
    [{label:'💾 Guardar',cls:'green',fn:()=>{
      const name=$('#cfName').value.trim(); if(!name){toast('Escribe el nombre');return;}
      const username=$('#cfUser').value.trim().toLowerCase();
      if(!username){toast('Escribe un usuario de acceso');return;}
      const taken=usernameTaken(username,{clientId:id});
      if(taken){toast('Ese usuario ya está en uso por '+taken);return;}
      const newPass=$('#cfPass').value;
      if(!id&&!newPass){toast('Define una contraseña para el nuevo cliente');return;}
      const data={name,type:$('#cfType').value,phone:$('#cfPhone').value,address:$('#cfAddr').value,username};
      if(newPass) data.password=newPass;
      else if(!id) data.password=username+'1';
      if(id){
        Object.assign(c,data);
        if(newPass) audit('Cambió contraseña cliente',name);
        else audit('Editó cliente',name);
      }else{
        DB.clients.push({id:uid(),emoji:{hotel:'🏨',restaurante:'🍽️',gastrobar:'🍸',otro:'🏪'}[data.type],password:data.password,...data});
        audit('Creó cliente',name+' · usuario '+username);
      }
      closeSheet(); renderClients();
      flushSave().then(()=>toast('Cliente guardado ✅'));
    }}]);
}

/* ---------- operarios (admin) ---------- */

  $('#adminBody').innerHTML=`
    <button class="btn green block pop" style="margin-bottom:10px" onclick="openWorkerForm()">➕ Nuevo operario</button>
    <p style="font-size:13px;color:var(--ink-soft);font-weight:700;margin-bottom:10px">Los operarios registran pesos reales. Solo la administradora define precios.</p>
    ${DB.workers.map((w,i)=>`
      <div class="list-row pop" style="animation-delay:${i*40}ms">
        <span class="le">⚖️</span>
        <div class="lt"><b>${w.name}</b><span>👤 ${w.username||'—'}</span></div>
        <button class="icon-btn" onclick="openWorkerForm('${w.id}')" title="Editar">✏️</button>
      </div>`).join('')||'<div class="empty" style="padding:16px"><span class="ee">👷</span><b class="display">Sin operarios</b><span>Agrega el primero con el botón de arriba</span></div>'}`;
}
function openWorkerForm(id){
  const w=id?DB.workers.find(x=>x.id===id):{name:'',username:'',password:''};
  const defaultUser=w.username||(!id&&w.name?slugUsername(w.name):'');
  openSheet(id?'✏️ Editar operario':'➕ Nuevo operario',`
    <div class="field"><label>Nombre</label><input id="wfName" value="${w.name}" placeholder="Ej.: Carlos" oninput="if(!${id?'true':'false'}&&!$('#wfUser').dataset.touched){$('#wfUser').value=slugUsername(this.value)}"></div>
    <div class="field"><label>Usuario de acceso</label><input id="wfUser" value="${defaultUser}" placeholder="Ej.: carlos" oninput="this.dataset.touched='1'"></div>
    <div class="field"><label>Contraseña</label><input id="wfPass" type="password" value="" placeholder="${id?'Dejar vacío para no cambiar':'Contraseña inicial'}"></div>`,
    [{label:'💾 Guardar',cls:'green',fn:()=>{
      const name=$('#wfName').value.trim();
      if(!name){toast('Escribe el nombre');return;}
      const username=$('#wfUser').value.trim().toLowerCase();
      if(!username){toast('Escribe un usuario de acceso');return;}
      const taken=usernameTaken(username,{workerId:id});
      if(taken){toast('Ese usuario ya está en uso por '+taken);return;}
      const newPass=$('#wfPass').value;
      if(!id&&!newPass){toast('Define una contraseña para el nuevo operario');return;}
      const data={name,username};
      if(newPass) data.password=newPass;
      else if(!id) data.password=username+'1';
      if(id){
        Object.assign(w,data);
        audit(newPass?'Cambió contraseña operario':'Editó operario',name);
      }else{
        DB.workers.push({id:uid(),password:data.password,...data});
        audit('Creó operario',name+' · usuario '+username);
      }
      closeSheet(); renderWorkers();
      flushSave().then(()=>toast('Operario guardado ✅'));
    }}]);
}
